name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SERVER }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 12589 -H 23.158.233.110 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -p 12589 -i ~/.ssh/id_rsa" \
            ./frontend/ \
            sisapec-prod@23.158.233.110:/home/sisapec-prod/site/

      - name: Publish to nginx root
        run: |
          ssh -p 12589 -i ~/.ssh/id_rsa sisapec-prod@23.158.233.110 \
            "/home/sisapec-prod/deploy_site.sh"
